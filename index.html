<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.7.3/core.js"></script>

    <title>Skills Test - 2nd Quarter</title>

    <style>
        body{
    background: url(https://i.pinimg.com/736x/3f/10/3f/3f103f3775ee48c75334c953bc1d56b0.jpg) no-repeat center center fixed;
    background-size: cover;
    min-height:100vh;
}
        .card{
            border:none;
            border-radius:20px;
        }

        .card-header{
            border-radius:20px 20px 0 0 !important;
        }

        #result{
            min-height:120px;
            font-size:1.05rem;
            background:#f8f9fa;
            border-left:6px solid #ee1515;
        }

        .footer-text{
            font-size:0.9rem;
            color:#6c757d;
        }
    </style>
</head>

<body>

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7 col-md-9">

            <div class="card shadow-lg">

                <div class="card-header bg-danger text-white text-center p-4">

                    <h2>
                        <i class="bi bi-lightning-charge-fill"></i>
                        Pokédex
                    </h2>

                    <p class="mb-0">
                        Pokédex Information Finder
                    </p>

                </div>

                <div class="card-body p-4">

                    <div class="alert alert-warning">
                        <strong>Instructions, Dear Fighter:</strong><br>
                        Enter the <b>Pokedex number</b> of a Pokémon
                        (Example: 1, 4, 25, 150).
                    </div>

                    <div class="mb-3">

                        <label class="form-label fw-bold" for="pokemon_number">
                            <i class="bi bi-search"></i>
                            Pokedex Number
                        </label>

                        <input
                            type="text"
                            id="pokemon_number"
                            class="form-control form-control-lg"
                            placeholder="Enter the number here">

                    </div>

                    <div class="d-grid">

                        <input
                            type="button"
                            py-click="pokemon_checker"
                            value="Check Details"
                            class="btn btn-warning btn-lg">

                    </div>

                    <hr>

                    <h5 class="text-danger">
                        <i class="bi bi-card-list"></i>
                        Result
                    </h5>

                    <div id="result" class="rounded p-3 shadow-sm">

                    </div>

                </div>

                <div class="card-footer bg-light text-center footer-text">

                    <i class="bi bi-lightbulb-fill text-warning"></i>
                    Skills Test • 2nd Quarter • Rafa Teylan

                </div>

            </div>

        </div>

    </div>

</div>

<script type="py" src="./main.py"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
